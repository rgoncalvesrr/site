name: Deploy Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build

      - name: Deploy production to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=pub --message "GitHub Actions ${{ github.sha }}"
